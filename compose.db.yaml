# Optional local database only. The app remains usable as a local-storage demo.
services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: first_press
      POSTGRES_DB: first_press
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # PostgreSQL 18 stores versioned PGDATA beneath /var/lib/postgresql.
      - first_press_pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U first_press -d first_press']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  first_press_pg:
