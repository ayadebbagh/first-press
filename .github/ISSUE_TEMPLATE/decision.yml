name: Decision
description: Resolve a product or technical choice
labels: ['needs:decision']
body:
  - type: textarea
    id: choice
    attributes:
      label: Decision and why it is needed now
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options, recommendation and tradeoffs
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Affected work and acceptance criteria
