name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the page, action and result. Do not include private account data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device and build or commit
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant redacted logs
