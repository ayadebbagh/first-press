name: Feature proposal
description: Propose a scoped improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Who needs this, and what becomes easier?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed behavior and boundaries
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes, dependencies and how to verify them.
