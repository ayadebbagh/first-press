# Temporary Drizzle custom-migration generation and transaction preflight.
name: Prepare and verify Credit ledger
on:
  push:
    branches: [feat/21-credit-ledger]
    paths: [.github/workflows/ledger-preparation.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: first_press_ci
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: first_press_ledger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U first_press_ci -d first_press_ledger_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_LEDGER_DATABASE_URL: postgresql://first_press_ci:isolated_ci_only@127.0.0.1:5432/first_press_ledger_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec drizzle-kit generate --custom --name=wallet_integrity
      - run: cp scripts/backing/wallet-integrity.sql drizzle/0004_wallet_integrity.sql
      - run: pnpm typecheck
      - run: pnpm test:ledger
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ledger-preparation
          path: drizzle/
          retention-days: 3
