name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Types, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm project:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:preview
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test app in isolated desktop and mobile browsers
        run: pnpm test:e2e
      - name: Keep browser reports, screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  container:
    name: Container HTTP smoke test
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose config --quiet
      - run: docker build --tag first-press:ci .
      - name: Check production server and routes
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name first-press --publish 127.0.0.1:3000:3000 first-press:ci
          trap 'docker logs first-press; docker rm --force first-press' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          curl --fail --silent --location http://127.0.0.1:3000/ --output /tmp/discover.html
          curl --fail --silent http://127.0.0.1:3000/catalog --output /tmp/catalog.html
          curl --fail --silent http://127.0.0.1:3000/favicon.svg --output /tmp/favicon.svg
          test -s /tmp/discover.html
          test -s /tmp/catalog.html
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/does-not-exist)
          test "$status" = 404
