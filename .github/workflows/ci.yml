name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Types, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm project:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:preview
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test app in isolated desktop and mobile browsers
        run: pnpm test:e2e
      - name: Keep browser reports, screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  database:
    name: PostgreSQL migrations and constraints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: first_press_ci
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: first_press_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U first_press_ci -d first_press_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://first_press_ci:isolated_ci_only@127.0.0.1:5432/first_press_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db
      - run: pnpm test:observations
        env:
          TEST_OBSERVATION_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Reject uncommitted schema changes
        run: |
          pnpm db:generate --name=ci_drift
          test -z "$(git status --porcelain -- drizzle)"
      - run: docker compose -f compose.yaml -f compose.db.yaml config --quiet
        env:
          POSTGRES_PASSWORD: isolated_ci_only

  authentication:
    name: Connected identity and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: first_press_ci
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: first_press_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U first_press_ci -d first_press_auth_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_AUTH_DATABASE_URL: postgresql://first_press_ci:isolated_ci_only@127.0.0.1:5432/first_press_auth_test
      TEST_SMTP_KEY: /tmp/first-press-smtp-key.pem
      TEST_SMTP_CERT: /tmp/first-press-smtp-cert.pem
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '2587'
      AUTH_EMAIL_FROM: FIRST PRESS Test <noreply@example.invalid>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - name: Create isolated SMTP TLS fixture certificate
        run: >-
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost'
          -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          -keyout "$TEST_SMTP_KEY" -out "$TEST_SMTP_CERT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:auth
        env:
          NODE_ENV: production
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:auth:e2e
        env:
          NODE_EXTRA_CA_CERTS: /tmp/first-press-smtp-cert.pem
      - name: Keep isolated account reports and failure traces
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: account-test-results
          path: |
            auth-playwright-report/
            auth-test-results/
          retention-days: 7
          if-no-files-found: ignore

  ledger:
    name: Credit ledger concurrency and reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: first_press_ci
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: first_press_ledger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U first_press_ci -d first_press_ledger_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_LEDGER_DATABASE_URL: postgresql://first_press_ci:isolated_ci_only@127.0.0.1:5432/first_press_ledger_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ledger

  container:
    name: Container HTTP smoke test
    needs: [validate, database, authentication, ledger]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose config --quiet
      - run: docker build --tag first-press:ci .
      - name: Check production server and routes
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name first-press --publish 127.0.0.1:3000:3000 first-press:ci
          trap 'docker logs first-press; docker rm --force first-press' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          curl --fail --silent --location http://127.0.0.1:3000/ --output /tmp/discover.html
          curl --fail --silent http://127.0.0.1:3000/catalog --output /tmp/catalog.html
          curl --fail --silent http://127.0.0.1:3000/favicon.svg --output /tmp/favicon.svg
          test -s /tmp/discover.html
          test -s /tmp/catalog.html
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/does-not-exist)
          test "$status" = 404
