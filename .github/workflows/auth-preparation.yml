# Temporary generation job; removed after reviewing outputs, before opening the PR.
name: Prepare auth dependencies and migrations
on:
  push:
    branches: [feat/20-invite-auth]
    paths: [.github/workflows/auth-preparation.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm auth:schema
      - run: node scripts/db/normalize-auth-schema.mjs
      - run: pnpm db:generate --name=auth_access
      - run: pnpm exec drizzle-kit generate --custom --name=auth_guards
      - run: cp scripts/auth/access-guards.sql drizzle/0003_auth_guards.sql
      - run: pnpm typecheck
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: auth-preparation
          path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
            src/server/db/auth.generated.ts
            drizzle/
          retention-days: 3
