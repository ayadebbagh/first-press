name: Planning metadata

on:
  push:
    branches: [main]
    paths:
      - docs/planning/backlog.json
      - scripts/planning.mjs
      - scripts/project-sync.mjs
      - .github/workflows/planning.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: planning-metadata
  cancel-in-progress: false

jobs:
  sync:
    name: Labels, milestones and issue membership
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Reconcile repository planning metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/project-sync.mjs --apply --metadata-only --repo "$GITHUB_REPOSITORY"
